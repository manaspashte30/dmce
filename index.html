<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam Prep: Web Programming and SQL</title>
<style>
  :root{--bg:#0f1220;--card:#181c30;--line:#2a3050;--txt:#e8eaf6;--mut:#9aa3c7;--a:#7c8cff;--b:#38d9a9;--warn:#ffb86b}
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  header{padding:28px 20px 10px;text-align:center}
  header h1{margin:0;font-size:1.8rem}
  header p{color:var(--mut);margin:6px 0 0}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 20px 60px}
  .choose{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}
  .big{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 20px;text-align:center;cursor:pointer;transition:.2s}
  .big:hover{transform:translateY(-4px);border-color:var(--a)}
  .big h2{margin:0 0 6px;font-size:1.6rem}
  .big span{color:var(--mut);font-size:.95rem}
  .big.java:hover{border-color:var(--warn)} .big.sql:hover{border-color:var(--b)}
  .hidden{display:none!important}
  .back{background:none;border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:8px;cursor:pointer;margin-bottom:14px}
  .back:hover{border-color:var(--a)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}
  .qcard:hover{border-color:var(--warn)}
  .num{background:var(--warn);color:#222;font-weight:700;border-radius:8px;min-width:32px;height:32px;display:flex;align-items:center;justify-content:center}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:6px}
  .panel h3{margin:0 0 4px}
  .qtext{color:var(--mut);margin:0 0 12px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .btn{background:var(--a);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}
  .btn.alt{background:#2a3050}
  .btn.ok{background:var(--b);color:#10231d}
  pre{background:#0a0c18;border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:520px;margin:0;font-size:.85rem;line-height:1.5;color:#d6dcff;white-space:pre}
  #overlay{position:fixed;inset:0;z-index:1000;background:#fff;display:flex;flex-direction:column}
  #overlay .obar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#181c30;color:#e8eaf6}
  #overlay .obar span{flex:1;font-weight:600}
  #overlay .x{background:#e03131;color:#fff;border:0;border-radius:8px;width:38px;height:38px;font-size:1.3rem;cursor:pointer;line-height:1}
  #overlay .newtab{background:#2a3050;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
  #overlay iframe{flex:1;width:100%;border:0;background:#fff}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer}
  .tab.on{background:var(--b);color:#10231d;border-color:var(--b);font-weight:700}
  .cmd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .cmd h4{margin:0 0 4px;color:var(--b)}
  .cmd p{margin:0 0 10px;color:var(--mut);font-size:.92rem}
  .cmd .bar{margin:8px 0 0}
  textarea.src{display:none}
  @media(max-width:640px){.choose{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Practical Exam Prep</h1>
  <p>Full Stack (Web) Programs and SQL Commands</p>
</header>

<div class="wrap">

  <div id="home" class="choose">
    <div class="big java" onclick="show('java')"><h2>Java / Full Stack</h2><span>10 problem statements with solutions</span></div>
    <div class="big sql" onclick="show('sql')"><h2>SQL / DBMS</h2><span>DDL, DML, DCL, Aggregates, syntax</span></div>

    <div id="oholder" style="flex:1;display:flex"></div>

<body>
<div class="box">
  <h2>My Tasks</h2>
  <input type="text" id="task" placeholder="Enter a task">
  <button onclick="addTask()">Add</button>
  <ul id="list"></ul>
</div>

<script>
function addTask(){
  var input = document.getElementById("task");
  var text = input.value.trim();
  if(text === ""){ alert("Please enter a task"); return; }

  var li = document.createElement("li");
  var span = document.createElement("span");
  span.innerText = text;

  var del = document.createElement("button");
  del.innerText = "Delete";
  del.onclick = function(){ li.remove(); };

  li.appendChild(span);
  li.appendChild(del);
  document.getElementById("list").appendChild(li);
  input.value = "";
}
</script>
</body>
</html>

<body>

<script>
function showTime(){
  var d = new Date();
  var h = String(d.getHours()).padStart(2, "0");
  var m = String(d.getMinutes()).padStart(2, "0");
  var s = String(d.getSeconds()).padStart(2, "0");
  document.getElementById("clock").innerText = h + ":" + m + ":" + s;
}
showTime();
setInterval(showTime, 1000);
</script>
</body>
</html>

  e.preventDefault();

<script>
/* ===================== NAVIGATION ===================== */
function show(id){
  ['home','java','sql'].forEach(function(x){
    document.getElementById(x).classList.toggle('hidden', x !== id);
  });
  if(id === 'java') backToList();
  if(id === 'sql' && !document.getElementById('scontent').innerHTML) renderSQL('DDL');
  window.scrollTo(0,0);
}

/* ===================== JAVA SECTION ===================== */
var questions = [
  "Create a webpage displaying your name, photo, educational details, hobbies, and contact information.",
  "Create a login form with username and password. Display an error for empty fields and show a success message when both are entered.",
  "Create an event webpage containing the event name, date, time, venue, description, and registration button.",
  "Create three buttons to change the webpage background to red, green, and blue.",
  "Create a weekly class timetable using an HTML table with days, time slots, subjects, and breaks.",
  "Allow users to enter a task, add it to a list, and delete a task using a button.",
  "Design a digital clock that displays the current time and updates every second using JavaScript.",
  "Create a webpage to promote a product with a product image, description, price, features, and a Buy Now button.",
  "Create a form with name, email, password, and submit button. Validate that no field is empty and the email contains @.",
  "Design a webpage about a tourist destination with images, a brief description, popular attractions, and travel information."
];
var current = 0;

(function buildList(){
  var box = document.getElementById('jlist');
  questions.forEach(function(q, i){
    var d = document.createElement('div');
    d.className = 'qcard';
    d.onclick = function(){ openQ(i); };
    d.innerHTML = '<div class="num">' + (i+1) + '</div><div>' + q + '</div>';
    box.appendChild(d);
  });
})();

function getCode(i){ return document.getElementById('s' + (i+1)).value.trim(); }

function openQ(i){
  current = i;
  document.getElementById('jlist').classList.add('hidden');
  document.getElementById('jview').classList.remove('hidden');
  document.getElementById('jtitle').textContent = 'Question ' + (i+1);
  document.getElementById('jq').textContent = questions[i];
  document.getElementById('jcode').textContent = getCode(i);
  closePreview();
  resetCopy();
  window.scrollTo(0,0);
}
function backToList(){
  document.getElementById('jlist').classList.remove('hidden');
  document.getElementById('jview').classList.add('hidden');
}
function togglePreview(){
  var holder = document.getElementById('oholder');
  holder.innerHTML = '';
  var f = document.createElement('iframe');
  holder.appendChild(f);
  document.getElementById('otitle').textContent = 'Live Preview - Question ' + (current+1);
  document.getElementById('overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  // write straight into the frame (works even where srcdoc/blob frames are blocked)
  var doc = f.contentWindow.document;
  doc.open();
  doc.write(getCode(current));
  doc.close();
}
function closePreview(){
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('oholder').innerHTML = '';
  document.body.style.overflow = '';
}
function openNewTab(){
  var blob = new Blob([getCode(current)], {type:'text/html'});
  window.open(URL.createObjectURL(blob), '_blank');
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closePreview();
});

/* ===================== COPY ===================== */
function copyText(text, btn, label){
  function done(){
    btn.textContent = 'Copied!';
    setTimeout(function(){ btn.textContent = label; }, 1500);
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
  } else { fallback(); }
  function fallback(){
    var t = document.createElement('textarea');
    t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); done(); }catch(e){ btn.textContent = 'Copy failed'; }
    document.body.removeChild(t);
  }
}
function copyCode(){ copyText(getCode(current), document.getElementById('jcopy'), 'Copy whole code'); }
function resetCopy(){ document.getElementById('jcopy').textContent = 'Copy whole code'; }

function renderSQL(tab){
  var tabs = document.getElementById('stabs');
  tabs.innerHTML = '';
  Object.keys(sqlData).forEach(function(k){
    var b = document.createElement('button');
    b.className = 'tab' + (k === tab ? ' on' : '');
    b.textContent = k === 'Aggregate' ? 'Aggregate Functions' : k;
    b.onclick = function(){ renderSQL(k); };
    tabs.appendChild(b);
  });
  var c = document.getElementById('scontent');
  c.innerHTML = '';
  sqlData[tab].forEach(function(item){
    var d = document.createElement('div');
    d.className = 'cmd';
    var h = document.createElement('h4'); h.textContent = item[0];
    var p = document.createElement('p'); p.textContent = item[1];
    var pre = document.createElement('pre'); pre.textContent = item[2];
    var bar = document.createElement('div'); bar.className = 'bar';
    var btn = document.createElement('button'); btn.className = 'btn ok'; btn.textContent = 'Copy';
    btn.onclick = function(){ copyText(item[2], btn, 'Copy'); };
    bar.appendChild(btn);
    d.appendChild(h); d.appendChild(p); d.appendChild(pre); d.appendChild(bar);
    c.appendChild(d);
  });
}
